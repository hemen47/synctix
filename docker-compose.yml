# Production-shaped stack. Caddy is the only published entry point; everything else is
# reachable only on the internal network.
#
# Three required services — proxy, web, api. Everything else is an opt-in profile
# (v2 principle 10):
#
#   docker compose --profile mongo    up -d   # MongoDB in a container
#   docker compose --profile kicad    up -d   # kicad-cli ERC/DRC/export wrapper
#   docker compose --profile indexing up -d   # redis + BullMQ worker for bulk ingestion
#   docker compose --profile search   up -d   # meilisearch parts index
#
# MongoDB is a profile because most people already have one: on a dev machine it is
# usually installed on the host, and in production it is usually Atlas. Running a
# container for it by default would mean a second, empty database competing for the same
# port as the one you are already using.
#
# Dev overrides (bind mounts, hot reload, published ports for debugging) live in
# docker-compose.dev.yml — see the Makefile.

name: syntrix

x-node-env: &node-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # host.docker.internal reaches a MongoDB running on the host from inside the container,
  # which is the common case. Point this at Atlas in production, or at mongo:27017 with
  # the `mongo` profile enabled.
  MONGO_URL: ${MONGO_URL:-mongodb://host.docker.internal:27017/vikronix_syntrix}
  MONGO_DNS_SERVERS: ${MONGO_DNS_SERVERS:-}
  ARTIFACTS_DIR: ${ARTIFACTS_DIR:-/data/artifacts}
  SYNTRIX_API_KEY: ${SYNTRIX_API_KEY:?SYNTRIX_API_KEY is required}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3015}
  # Profile-only. Empty means the feature is disabled, never that the app fails to boot.
  KICAD_SERVICE_URL: ${KICAD_SERVICE_URL:-}
  REDIS_URL: ${REDIS_URL:-}
  MEILI_URL: ${MEILI_URL:-}
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}

x-restart: &restart
  restart: unless-stopped

services:
  # ------------------------------------------------------------- required (edge)
  proxy:
    image: caddy:2.8-alpine
    <<: *restart
    ports:
      - "${PUBLIC_PORT:-3015}:3015"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3015/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------- required (apps)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked at build time: the browser bundle only ever learns the public origin,
        # never a secret.
        VITE_API_BASE: /api
    <<: *restart
    environment:
      <<: *node-env
      WEB_PORT: 3016
    expose: ["3016"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3016/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # REST + SSE + MCP (Streamable HTTP at /mcp) + the in-process job queue, one process.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: *restart
    environment:
      <<: *node-env
      API_PORT: 3017
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?MCP_BEARER_TOKEN is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DIGIKEY_CLIENT_ID: ${DIGIKEY_CLIENT_ID:-}
      DIGIKEY_CLIENT_SECRET: ${DIGIKEY_CLIENT_SECRET:-}
      DIGIKEY_BASE_URL: ${DIGIKEY_BASE_URL:-https://sandbox-api.digikey.com}
      NEXAR_CLIENT_ID: ${NEXAR_CLIENT_ID:-}
      NEXAR_CLIENT_SECRET: ${NEXAR_CLIENT_SECRET:-}
      MOUSER_API_KEY: ${MOUSER_API_KEY:-}
    expose: ["3017"]
    volumes:
      - ./data/artifacts:/data/artifacts
    # Reaches a MongoDB on the host. Harmless on Linux, where it is not automatic.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3017/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------- profile: mongo
  # Only if you want the database in a container. Set
  # MONGO_URL=mongodb://mongo:27017/vikronix_syntrix to use it.
  mongo:
    profiles: ["mongo"]
    image: mongo:7
    <<: *restart
    volumes:
      - mongo-data:/data/db
    expose: ["27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------- profile: kicad
  # Wraps kicad-cli so the api never shells out to a versionless binary: sch erc,
  # pcb drc, sch export svg/pdf, pcb export gerbers/step.
  kicad:
    profiles: ["kicad"]
    build:
      context: ./services/kicad
    <<: *restart
    environment:
      KICAD_PORT: 3019
    expose: ["3019"]
    volumes:
      - kicad-work:/work
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3019/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ------------------------------------------------------------- profile: indexing
  # Bulk parts ingestion only. Without it the same job handlers run in-process in the
  # api against the Mongo-backed queue.
  redis:
    profiles: ["indexing"]
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Runs the same job handlers as the api, against BullMQ instead of the Mongo queue.
  # The entrypoint itself arrives with the bulk ingestion jobs at M7.
  worker:
    profiles: ["indexing"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/worker.js"]
    <<: *restart
    environment:
      <<: *node-env
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WORKER_HEALTH_PORT: 3023
      DIGIKEY_CLIENT_ID: ${DIGIKEY_CLIENT_ID:-}
      DIGIKEY_CLIENT_SECRET: ${DIGIKEY_CLIENT_SECRET:-}
      MOUSER_API_KEY: ${MOUSER_API_KEY:-}
    expose: ["3023"]
    volumes:
      - ./data/artifacts:/data/artifacts
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3023/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------- profile: search
  meilisearch:
    profiles: ["search"]
    image: getmeili/meilisearch:v1.11
    <<: *restart
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required for the search profile}
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - meili-data:/meili_data
    expose: ["7700"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
  redis-data:
  meili-data:
  caddy-data:
  caddy-config:
  kicad-work:
