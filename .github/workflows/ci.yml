name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo needs no remote cache here, but the env var silences its telemetry prompt.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm -r test:run

      - name: Core coverage thresholds
        # M1's 90% requirement is enforced by vitest config, so this step fails the
        # build rather than merely reporting a number.
        run: pnpm --filter @syntrix/core test:run -- --coverage

  services:
    name: Build service images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The KiCad image is several GB and would dominate CI time, so only the small
      # Python services are built here. The KiCad and Freerouting images are exercised
      # by the M0 manual acceptance script instead.
      - name: Build sim image
        uses: docker/build-push-action@v6
        with:
          context: ./services/sim
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build pytools image
        uses: docker/build-push-action@v6
        with:
          context: ./services/pytools
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render compose config
        # Catches YAML errors, bad anchors and undefined required variables before they
        # reach a VPS.
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
