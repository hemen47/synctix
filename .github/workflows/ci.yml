name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm -r test:run

      - name: Core coverage thresholds
        # M1's 90% requirement is enforced by vitest config, so this step fails the
        # build rather than merely reporting a number.
        run: pnpm --filter @syntrix/core test:run -- --coverage

  build:
    name: Build and serve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # There are no images and no compose file to validate any more (ADR-0029). What
      # replaces them is the check that the one thing we ship actually starts: a single
      # Node process serving the built app, the API and MCP on one port.
      - name: Start the production server and check it serves the app
        env:
          NODE_ENV: production
          PORT: 3015
        run: |
          node apps/api/dist/index.js &
          server=$!
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:3015/live" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://localhost:3015/health" | tee /dev/stderr | grep -q '"status"'
          curl -fsS "http://localhost:3015/" | grep -qi "<div id=\"root\"" 
          kill $server
