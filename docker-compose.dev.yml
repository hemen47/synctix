# Development overlay:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Publishes every running service's port on the host for direct debugging and mounts the
# source tree for hot reload. Profile services only appear when their profile is enabled.

name: syntrix

services:
  proxy:
    ports:
      - "${PUBLIC_PORT:-3015}:3015"

  web:
    build:
      target: dev
    command: ["pnpm", "--filter", "@syntrix/web", "dev", "--host", "0.0.0.0", "--port", "3016"]
    environment:
      NODE_ENV: development
    ports:
      - "${WEB_PORT:-3016}:3016"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      # Anonymous volumes keep container-installed node_modules from being shadowed by
      # the host mount — the host tree has Windows/linux-incompatible binaries.
      - /app/node_modules
      - /app/apps/web/node_modules

  api:
    build:
      target: dev
    command: ["pnpm", "--filter", "@syntrix/api", "dev"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "${API_PORT:-3017}:3017"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./config:/app/config:ro
      - ./data/artifacts:/data/artifacts
      - /app/node_modules
      - /app/apps/api/node_modules

  # --- profile services -------------------------------------------------------
  mongo:
    ports:
      - "27017:27017"

  kicad:
    ports:
      - "${KICAD_PORT:-3019}:3019"
    volumes:
      - ./services/kicad/app:/app:ro

  redis:
    ports:
      - "6379:6379"

  # The `dev:worker` script lands with the bulk ingestion jobs at M7.
  worker:
    build:
      target: dev
    command: ["pnpm", "--filter", "@syntrix/api", "dev:worker"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./data/artifacts:/data/artifacts
      - /app/node_modules
      - /app/apps/api/node_modules

  meilisearch:
    environment:
      MEILI_ENV: development
    ports:
      - "7700:7700"
